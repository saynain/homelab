apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: homepage-tls
  namespace: default
spec:
  secretName: homepage-tls
  duration: 2160h # 90 days
  renewBefore: 360h # 15 days
  commonName: dash.saynain.local
  dnsNames:
  - dash.saynain.local
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer

